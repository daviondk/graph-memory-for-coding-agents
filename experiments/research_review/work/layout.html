<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@ · Обзор исследований</title>
<style>
:root{color-scheme:light;--ink:#1a2a32;--sub:#4b5c65;--rule:#c9d5d6;--link:#14615e;--bg:#fcfcf9;--soft:#eef4f0}*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.62 "Segoe UI",Arial,sans-serif}header{border-top:7px solid #1a5950;border-bottom:1px solid var(--rule);background:#edf3ee}header>div{max-width:1320px;margin:0 auto;padding:47px 52px 36px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;text-wrap:pretty}h1{font-weight:500;font-size:clamp(2.45rem,5vw,4.3rem);letter-spacing:-.045em;line-height:1.04;margin:0 0 19px;max-width:930px}header p{font-size:18px;color:var(--sub);max-width:780px;margin:0}#grid{max-width:1320px;padding:38px 52px 72px;margin:auto;display:grid;grid-template-columns:212px minmax(0,1fr);gap:54px}aside{min-width:0}nav{position:sticky;top:24px;font-size:14px;line-height:1.35;padding-top:10px}nav b{display:block;margin:0 0 12px}nav a{display:block;color:var(--sub);padding:7px 10px 7px 12px;border-left:2px solid var(--rule);text-decoration:none}nav a:hover,nav a:focus{border-color:var(--link);color:var(--link);background:var(--soft)}main{min-width:0}a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px}a:hover{text-decoration-thickness:2px}h2{font-size:clamp(1.8rem,3vw,2.65rem);line-height:1.15;letter-spacing:-.035em;font-weight:500;margin:54px 0 18px;padding-top:25px;border-top:1px solid var(--rule)}h2:first-child{border:0;margin-top:0;padding-top:0}h3{font-size:1.5rem;line-height:1.25;letter-spacing:-.025em;margin:28px 0 10px}p{margin:12px 0 17px}ol{padding-left:1.45em}li{padding-left:4px;margin:10px 0}strong{font-weight:650}code{font: .86em/1.4 Consolas,monospace;word-break:break-word;background:#eaf0ed;border-radius:3px;padding:1px 4px}.cite{font-size:.88em;white-space:normal}.tablebox{margin:22px 0 25px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.48;text-align:left}th,td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-weight:620;background:var(--soft);color:#243e38}td:first-child{font-weight:580;min-width:115px}td p{margin:0}label{font-weight:600;font-size:14px;display:block;margin-bottom:3px}.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--rule);padding:0 0 16px}.filters>div:first-child{flex:1;min-width:175px}input,select{border:1px solid #91a6a0;background:white;border-radius:4px;min-height:38px;padding:6px 10px;color:var(--ink);font:16px "Segoe UI",Arial,sans-serif;width:100%}#count{font-size:14px;color:var(--sub);margin:8px 0 0}.ref{padding:14px 0;border-bottom:1px solid var(--rule);break-inside:avoid}.ref small,.ref footer{font-size:13px;color:var(--sub);line-height:1.45}.ref h4{font-size:17px;line-height:1.35;margin:4px 0;font-weight:620}.ref p{font-size:15px;line-height:1.5;margin:5px 0}.ref footer{margin-top:6px}.back{display:inline-block;margin-top:26px}[hidden]{display:none!important}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9a652c;outline-offset:2px}@media(max-width:900px){#grid{grid-template-columns:165px minmax(0,1fr);gap:26px;padding:28px}header>div{padding:32px 28px}}@media(max-width:700px){body{font-size:16px}header>div{padding:30px 18px 26px}#grid{display:block;padding:18px 18px 48px}aside{margin:0 0 27px}nav{position:static;display:flex;flex-wrap:wrap;gap:5px 12px}nav b{width:100%;margin:0 0 2px}nav a{border:0;padding:1px 0;text-decoration:underline}h2{margin-top:34px}th,td{padding:8px;font-size:14px}td:first-child{min-width:80px}.filters{display:block}.filters>div{margin:9px 0}.tablebox{max-width:100%}}
@media print{@page{size:A4;margin:1.5cm}body{background:white;font:10.5pt/1.4 Georgia,serif}header{background:white;border-top:0}header>div,#grid{display:block;padding:0;max-width:none}header p{font-size:11pt;margin-bottom:15pt}h1{font-size:28pt}aside,.filters,#count,.back{display:none}h2{font-size:20pt;margin-top:20pt;padding-top:10pt;break-after:avoid}h3{font-size:14pt;break-after:avoid}.tablebox{overflow:visible}tr{break-inside:avoid}th,td{padding:5pt;font-size:9pt}a{color:#144c48}.ref{padding:6pt 0}.ref[hidden]{display:block!important}}
</style></head><body id="top"><header><div><h1>@@TITLE@@</h1><p>@@LEAD@@</p></div></header>
<div id="grid"><aside><nav aria-label="Содержание"><b>Содержание</b>@@NAV@@</nav></aside><main>@@BODY@@
<section id="sources"><h2>Аннотированная библиография</h2><p>@@N@@ работ, включая обзорные и методические. У каждой указаны область, источник и граница применения.</p>
<div class="filters"><div><label for="query">Поиск по работам</label><input id="query" type="search" placeholder="Автор, название или метод"></div><div><label for="topic">Область</label><select id="topic"><option value="">Все области</option>@@GROUPS@@</select></div></div><p id="count" aria-live="polite"></p>
<div id="refs">@@CARDS@@</div></section><a class="back" href="#top">К началу обзора ↑</a></main></div>
<script>
const box=document.getElementById('query'), topic=document.getElementById('topic'), cards=Array.from(document.querySelectorAll('article.ref'));
function update(){let n=0;const term=box.value.toLocaleLowerCase('ru').trim();for(const card of cards){card.hidden=Boolean((topic.value&&topic.value!==card.dataset.group)||!(card.textContent+' '+card.dataset.keywords).toLocaleLowerCase('ru').includes(term));if(!card.hidden)n++}document.getElementById('count').textContent='Показано '+n+' из '+cards.length}
box.addEventListener('input',update);topic.addEventListener('change',update);update()
</script></body></html>
