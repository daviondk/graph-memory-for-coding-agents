[project]
name = "block-context"
version = "0.1.0"
description = "Agent-aware provenance-indexed coherence runtime for mutable trajectory context blocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
block-context = "block_context.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
