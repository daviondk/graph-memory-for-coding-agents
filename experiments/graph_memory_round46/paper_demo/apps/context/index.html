<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory after a code edit</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.48 "Segoe UI",Arial,sans-serif;background:#f5f6f2;color:#19332d}main{max-width:1060px;margin:auto;padding:30px 24px}h1{margin:0;font:500 clamp(30px,4.5vw,49px)/1.1 Georgia,serif}h2{font-size:18px;margin:0 0 9px}p{margin:7px 0 15px}.controls{display:flex;flex-wrap:wrap;gap:18px;margin:24px 0 18px}label{display:grid;gap:4px;font-size:14px}select,button{font:inherit;color:inherit;padding:6px 9px;background:#fff;border:1px solid #a8bab0;border-radius:4px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #34775d}.panel{padding:16px 18px;background:#fff;border:1px solid #ced8cf;border-radius:5px;margin:12px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols .panel{margin:0}#decision{font-weight:700;color:#265842}#packet,#literal{font-family:Consolas,monospace;font-size:14px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:6px 10px;border-bottom:1px solid #dde3dd}th{font-size:13px;color:#40594f}#audit{margin-top:12px}.audit{font-size:15px}details{margin-top:15px}summary{cursor:pointer}@media(max-width:630px){main{padding:16px}.cols{grid-template-columns:1fr}th,td{padding:4px}} </style>
<main><h1>Memory after a code edit</h1><p>Rebuild a bounded packet from the agent’s prior observations and the editor’s confirmed replacement.</p>
<div class="controls"><label>Recorded edit<select id="case"><option value="edges">Unchanged edge lines</option><option value="interior">Unchanged interior lines</option><option value="changed">Replaced evidence</option></select></label><label>How to validate blocks<select id="policy"><option value="file">Discard the affected file</option><option value="range" selected>Use the edit range</option><option value="edges">Match equal edges</option><option value="local">Align all equal runs</option></select></label><label>Packet budget in bytes<select id="budget"><option>512</option><option>1024</option><option selected>2048</option></select></label></div>
<div class="cols"><section class="panel"><h2>Selected observations</h2><div id="decision" aria-live="polite"></div><p id="packet"></p></section><section class="panel"><h2>Editor input</h2><p id="edit"></p><details><summary>Inspect literal line fingerprints</summary><p id="literal"></p></details></section></div>
<section class="panel"><h2>Source addresses</h2><table><thead><tr><th>Block</th><th>Before</th><th>After</th><th>Cost</th><th>Selected</th></tr></thead><tbody id="rows"></tbody></table><button id="audit">Verify selected source lines</button><p id="result" role="status" class="audit"></p></section></main>
<script>
const $=id=>document.getElementById(id),set=(id,s)=>$(id).textContent=s;let revision=0;
function route(path){return path+"?"+new URLSearchParams(Object.fromEntries(["case","policy","budget"].map(k=>[k,$(k).value])))}
async function run(audit=false){const r=++revision;const x=await(await fetch(route(audit?"audit":"packet"))).json();if(r!==revision)return;
set("decision",x.reused?"Original packet preserved":"Packet changed");set("packet","Before "+JSON.stringify(x.prior)+" → After "+JSON.stringify(x.selected));
set("edit","Lines "+x.begin+"–"+x.end+" · shift "+x.delta+" · "+x.bytes+" argument bytes. "+x.edges+" equal edge lines and "+x.interior+" equal interior lines.");
set("literal","Old: "+x.old_tags.join(" ")+" | New: "+x.new_tags.join(" "));$("rows").replaceChildren();
for(const b of x.blocks){let tr=document.createElement("tr");for(const s of ["#"+b.id,b.old.join("–"),b.new?b.new.join("–"):"Revoked",b.bytes,x.selected.includes(b.id)?"Yes":""]){let td=document.createElement("td");td.textContent=s;tr.append(td)}$("rows").append(tr)}
set("result",x.audit?x.audit.lines+" selected lines on the edited path checked against both versions · "+x.audit.mismatches+" mismatches":"");document.body.dataset.ready=[$("case").value,$("policy").value,$("budget").value].join("/")}
for(const id of ["case","policy","budget"])$(id).onchange=()=>run().catch(e=>set("result",String(e)));
$("audit").onclick=()=>run(true).catch(e=>set("result",String(e)));run().catch(e=>set("result",String(e)));
</script></html>
