<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source-linked evidence views</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 Inter,Arial,sans-serif;background:#f3f4ef;color:#122b2b}header{background:#183733;color:white;padding:20px 30px;display:flex;align-items:baseline;gap:20px}h1{margin:0;font-size:29px}header small{color:#bce2c2}main{max-width:1280px;padding:18px 28px;margin:auto}label{display:grid;gap:4px;font-size:13px;font-weight:600}select,button{border:1px solid #98ada4;background:white;border-radius:4px;color:inherit;padding:7px 10px;font-size:14px}button{cursor:pointer}.toolbar,.controls,.tags{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar{padding-bottom:14px}.controls{margin:12px 0 18px;align-items:center}section{background:white;border:1px solid #ced5cc;border-radius:6px;padding:15px 18px;margin-bottom:12px}h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:10px 0 3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}code{font-size:13px;overflow-wrap:anywhere}p{margin:5px 0}small{color:#52645b}.tag{padding:4px 9px;border-radius:4px;background:#dfebd8;color:#224b36;font-weight:650}.important{font-size:23px;font-weight:700}.items{max-height:205px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:4px 7px;border-bottom:1px solid #dfe4de}td button{padding:1px 5px;font:inherit;border:0;color:#005b50;text-decoration:underline}.result{display:block;margin-top:6px}.accent{background:#284f42;color:white}#proof{font-size:15px}@media(max-width:680px){.grid{display:block}header{display:block}main{padding:12px}}
</style><header><h1>Source-linked evidence views</h1><small>ISETrace · SQLite</small></header><main><div class="toolbar"><label>Trace query<select id="q"></select></label><label>Token budget<select id="b"><option>1024</option><option selected>2048</option><option>3072</option></select></label><label>Excluded source<select id="s"><option value="">All available</option></select></label><label>Maintenance<select id="mode"><option value="certificate">Indexed certificate</option><option value="full">Full recomputation</option></select></label></div>
<div class="controls"><span>Try a source</span><button id="clean">Outside dependencies</button><button id="hit">In the packet</button><button id="boundary">At the prefix boundary</button><button id="reset">Restore sources</button></div><div class="grid"><section><h2>Maintenance decision</h2><span id="action" class="important"></span><p id="proof"></p><small id="guards"></small></section><section><h2>Packet after exclusion</h2><div class="tags"><span id="counts" class="tag"></span><span id="cost" class="tag"></span></div><p id="change"></p><small>Relative to the source-complete packet at this budget.</small></section></div><div class="grid"><section><h2>Source-linked units</h2><div class="items"><table><thead><tr><th>Unit</th><th>Rank</th><th>Tokens</th><th>Chosen by</th></tr></thead><tbody id="items"></tbody></table></div></section><section><h2>Source witness</h2><p id="span"></p><h3>Execution graph</h3><div id="edges"></div></section></div><section><h2>Independent audit</h2><button id="grade" class="accent">Recompute and score</button><output class="result" id="result" aria-live="polite"></output></section><small role="status" id="status"></small></main><script>
const E=id=>document.getElementById(id);let state,serial=0,options=[];
function p(){let a=new URLSearchParams({q:E('q').value,b:E('b').value,mode:E('mode').value});if(E('s').value)a.set('s',E('s').value);return a}
async function api(url){let r=await fetch(url);if(!r.ok)throw Error('Request failed: '+r.status);return r.json()}
function details(i){let x=state.items[i];E('span').textContent=x?'#'+x.id+' → ['+x.spans[0].start+', '+x.spans[0].end+') → '+x.spans[0].role+' '+x.spans[0].source.slice(0,9)+' · message '+x.spans[0].position:'No selected units';E('edges').replaceChildren();for(const e of x?x.edges:[]){let line=document.createElement('div'),c=document.createElement('code');c.textContent=(e.direction==='in'?'← ':'→ ')+e.relation+' · '+e.node.slice(0,10);line.append(c);E('edges').append(line)}}
function render(v){state=v;options=v.sources;let s=E('s');s.replaceChildren(new Option('All available',''));for(let t of options)s.add(new Option(t.role+' · '+t.id.slice(0,10),t.id));s.value=v.source||'';E('action').textContent=v.action;E('proof').textContent=!v.source?'Choose a source to test its dependencies.':v.mode==='full'?'Recompute over the remaining eligible units.':v.dep_selected?'A selected unit uses the excluded source.':v.dep_barrier?'Removing the prefix boundary can admit a new protected unit.':'The chosen units and the prefix boundary survive.';E('guards').textContent='Selected dependency: '+(v.dep_selected?'yes':'no')+'  ·  Boundary dependency: '+(v.dep_barrier?'yes':'no')+'  ·  Boundary unit #'+v.barrier;E('counts').textContent=v.total+' units';E('cost').textContent=v.tokens.toLocaleString('en-US')+' / '+v.budget.toLocaleString('en-US')+' tokens';E('change').textContent='Added '+(v.added.map(x=>'#'+x).join(', ')||'none')+'   ·   Removed '+(v.removed.map(x=>'#'+x).join(', ')||'none');let t=E('items');t.replaceChildren();v.items.forEach((x,i)=>{let tr=document.createElement('tr');for(let val of [x.id,x.rank,x.tokens,x.reason]){let td=document.createElement('td');if(!tr.children.length){let b=document.createElement('button');b.textContent='#'+val;b.onclick=()=>details(i);td.append(b)}else td.textContent=val;tr.append(td)}t.append(tr)});details(0);E('status').textContent=v.budget===2048?'At the development-selected operating point.':'Sensitivity analysis at a different budget.';document.documentElement.dataset.ready=[v.q,v.budget,v.source||'',v.mode].join('|')}
async function go(){let n=++serial;E('result').textContent='';E('grade').disabled=true;try{let v=await api('/api/packet?'+p());if(n===serial){render(v);E('grade').disabled=false}}catch(e){if(n===serial)E('status').textContent=e.message}}
function preset(f){let x=options.find(f);if(x){E('s').value=x.id;go()}}
E('clean').onclick=()=>preset(x=>!x.selected&&!x.barrier);E('hit').onclick=()=>preset(x=>x.selected);E('boundary').onclick=async()=>{E('q').value='q07';E('b').value=2048;E('s').value='';await go();preset(x=>x.barrier&&!x.selected)};E('reset').onclick=()=>{E('s').value='';go()};E('q').onchange=()=>{E('s').value='';go()};E('b').onchange=E('s').onchange=E('mode').onchange=go;E('grade').onclick=async()=>{let n=serial;try{let v=await api('/api/audit?'+p());if(n===serial)E('result').textContent=(v.audit.full_matches?'Matches full recomputation. ':'Mismatch. ')+'Gold support '+v.audit.covered_chars+'/'+v.audit.gold_chars+' characters ('+(100*v.audit.coverage).toFixed(1)+'%).'}catch(e){E('status').textContent=e.message}};
(async()=>{let a=await api('/api/queries');for(let q of a.queries)E('q').add(new Option(q,q));E('q').value='q02';await go()})()
</script></html>
