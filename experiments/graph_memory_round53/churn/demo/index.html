<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence history · q11</title><style>
:root{font-family:Geist,Inter,"Segoe UI",sans-serif;color:#e9ece6;background:#111a1b;color-scheme:dark;--line:#365252;--muted:#abc2bb;--accent:#b1e9bc}
*{box-sizing:border-box}body{margin:0}main{max-width:990px;margin:auto;padding:46px 25px 60px}h1,h2,p{margin:0}h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.055em;font-weight:650}h2{font-size:1.22rem;font-weight:600}
header p{margin:9px 0 25px;color:var(--muted);max-width:740px;line-height:1.5}section{border-top:1px solid var(--line);padding:20px 0}
.controls,.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}.controls label{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.controls input{width:100%;grid-column:1/3;accent-color:var(--accent)}output{font:600 1.35rem ui-monospace,monospace;color:var(--accent)}
.box{border:1px solid var(--line);padding:18px;border-radius:8px}.box p{font:600 1.45rem ui-monospace,monospace;color:var(--accent);margin-top:8px}.counts,.detail,small{color:var(--muted);line-height:1.5}.detail{margin-top:10px}.counts{margin-top:18px}table{border-collapse:collapse;margin-top:12px;width:100%;text-align:left}th,td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
details{margin-top:15px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:.85rem}button{cursor:pointer;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--accent);padding:6px 12px;margin-top:12px}button:hover{border-color:var(--accent)}
@media(max-width:590px){main{padding:25px 16px}.controls,.twocol{grid-template-columns:1fr;gap:12px}}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{margin:0;white-space:nowrap}
</style><main><header><div class="top"><h1 data-i="title">Evidence history</h1><button id="lang" type="button" aria-label="Switch language">Русский</button></div><p data-i="intro">Trace q11. Each revision ranks tool outputs by the sum of their outgoing FEEDS weights. The lower ID wins a tie.</p></header>
<section><div class="controls"><label><span data-i="commitCount">Committed revision</span><output id="hv">17</output><input id="horizon" type="range" min="0" max="32" value="17"></label>
<label><span data-i="queryVersion">Requested revision</span><output id="vv">16</output><input id="version" type="range" min="0" max="17" value="16"></label></div>
<button id="reset" data-i="reset">Show the retraction of evidence 14 → 19</button></section>
<section><div class="twocol"><article class="box"><h2 data-i="interval">Recompute from edge intervals</h2><p id="raw">…</p></article><article class="box"><h2 data-i="journal">Look up the winner history</h2><p id="log">…</p></article></div>
<p class="detail" id="pred"></p></section><section><h2 id="commit"></h2><p class="detail" id="context"></p>
<table><thead><tr><th data-i="edge">Edge</th><th data-i="before">Before</th><th data-i="delta">Change</th><th data-i="after">After</th></tr></thead><tbody id="events"></tbody></table>
<p class="counts" id="counts"></p><details><summary data-i="plans">SQLite plans and checksums</summary><pre id="plans"></pre></details></section>
<section><details><summary data-i="history">Changes of winning address or score</summary><pre id="history"></pre></details></section><p role="alert" id="error"></p></main>
<script>
const el=id=>document.getElementById(id),h=el("horizon"),v=el("version");let serial=0,lang="en",latest;
const ru={title:"История свидетельств",intro:"Траектория q11. Источники ранжируются по сумме весов их исходящих связей FEEDS. При равных оценках выигрывает меньший ID.",commitCount:"Применено ревизий",queryVersion:"Запрошенная ревизия",reset:"Показать отзыв свидетельства 14 → 19",interval:"Пересчёт по интервалам",journal:"Индекс журнала победителей",edge:"Связь",before:"Было",delta:"Поправка",after:"Стало",plans:"Планы SQLite и контрольные суммы",history:"Журнал смен адреса или оценки"};
const en=Object.fromEntries(Array.from(document.querySelectorAll("[data-i]"),e=>[e.dataset.i,e.textContent]));
const t=(a,b)=>lang==="en"?a:b;
function format(x){return x?"#"+x[0]+t(" · score "," · оценка ")+x[1]:t("No sources yet","Ещё нет источников")}
function render(d){
 el("raw").textContent=format(d.query.interval);el("log").textContent=format(d.query.journal);
 el("pred").textContent=d.predecessor_record?t("For revision "+d.version+", the last winner entry is at revision "+d.predecessor_record[0]+".","Для версии "+d.version+" последняя запись журнала находится на ревизии "+d.predecessor_record[0]+"."):t("No entry at revision zero.","На версии 0 журнал пуст.");
 el("commit").textContent=t("Change at revision ","Изменение на ревизии ")+d.horizon;
 el("context").textContent=d.horizon?t("Message boundary ","Граница сообщения ")+d.message_boundary+t(". Previous winner: ",". Предыдущий лидер: ")+format(d.previous_commit.interval)+t(". Current winner: ",". Текущий лидер: ")+format(d.current.interval)+t(". New sources: ",". Новые источники: ")+(d.born_at_horizon.join(", ")||t("none","нет"))+".":t("No revisions applied.","Ещё не применено ни одной ревизии.");
 const tb=el("events");tb.replaceChildren();for(const e of d.changes_at_horizon){const tr=document.createElement("tr");for(const val of [e.from+" → "+e.to,e.was,(e.delta>0?"+":"")+e.delta,e.now]){const td=document.createElement("td");td.textContent=val;tr.append(td)}tb.append(tr)}
 if(!tb.children.length){const r=tb.insertRow(),td=r.insertCell();td.colSpan=4;td.textContent=t("Edges unchanged.","Связи не изменились.")}
 const n=d.counts_at_horizon;el("counts").textContent=n.available+t(" sources · "," источников · ")+n.open_edges+t(" active edges · "," действующих связей · ")+n.edge_intervals+t(" edge intervals · "," интервалов · ")+n.winner_entries+t(" history entries"," записей журнала");
 el("plans").textContent=Object.entries(d.plans).map(([k,a])=>k+"\n"+a.join("\n")).join("\n\n")+t("\n\nRevision SHA-256: ","\n\nSHA-256 ревизии: ")+(d.receipt_sha256||"—")+t("\nFEEDS fixture SHA-256: ","\nSHA-256 фикстуры FEEDS: ")+d.fixture_sha256;
 el("history").textContent=d.transitions.map(([rev,c,s])=>"v"+rev+"   #"+c+t("   score ","   оценка ")+s).join("\n")||t("Empty history.","Журнал пуст.");
}
async function show(){const id=++serial;v.max=h.value;if(+v.value>+h.value)v.value=h.value;el("hv").value=h.value;el("vv").value=v.value;
 try{const res=await fetch("/api/state?horizon="+h.value+"&version="+v.value);if(!res.ok)throw Error(await res.text());const d=await res.json();if(id!==serial)return;el("error").textContent="";latest=d;render(d)}
 catch(e){if(id===serial)el("error").textContent=e.message}}
el("lang").onclick=()=>{lang=lang==="en"?"ru":"en";document.documentElement.lang=lang;const labels=lang==="en"?en:ru;for(const e of document.querySelectorAll("[data-i]"))e.textContent=labels[e.dataset.i];el("lang").textContent=t("Русский","English");document.title=labels.title+" · q11";if(latest)render(latest)};
h.oninput=show;v.oninput=show;el("reset").onclick=()=>{h.value=17;v.max=17;v.value=16;show()};show();
</script></html>
